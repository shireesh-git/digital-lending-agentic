services:
  cam:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cam-platform
    env_file:
      - path: .env.local
        required: false
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
      - ./output:/app/output
      - ./runtime-db:/app/runtime-db
      - "./downloaded document:/app/reference-docs:ro"
      - ./synthetic-assets:/app/synthetic-assets
    environment:
      - PYTHONUNBUFFERED=1
      - OLLAMA_HOST=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
