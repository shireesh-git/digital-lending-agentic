<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#003366">
  <title>CAM Intelligence Platform</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23003366'/%3E%3Cpath d='M32 14 49 32 32 50 15 32Z' fill='%23c9a227'/%3E%3C/svg%3E">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="/static/css/dashboard.css">
</head>
<body>

<!-- Icon set: <svg class="icon" width="16" height="16" aria-hidden="true"><use href="#i-NAME"/></svg>; strokes follow the text colour -->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <symbol id="i-play" viewBox="0 0 24 24"><path class="icon-solid" d="M7 4v16l13-8z"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4L21 8"/><path d="M21 3v5h-5"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></symbol>
  <symbol id="i-save" viewBox="0 0 24 24"><path d="M5 3h11l5 5v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M7 3v5h8"/><path d="M7 21v-7h10v7"/></symbol>
  <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/></symbol>
  <symbol id="i-print" viewBox="0 0 24 24"><path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M6 14h12v7H6z"/></symbol>
  <symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
  <symbol id="i-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></symbol>
  <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></symbol>
  <symbol id="i-sort" viewBox="0 0 24 24"><path d="m7 15 5 5 5-5M7 9l5-5 5 5"/></symbol>
  <symbol id="i-sort-up" viewBox="0 0 24 24"><path d="m7 14 5-5 5 5"/></symbol>
  <symbol id="i-sort-down" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></symbol>
</svg>

<a class="skip-link" href="#main">Skip to content</a>

<div x-data="camApp()" class="app-shell">
  <header class="app-topbar">
    <div class="topbar-brand">
      <div class="brand-icon">&#9670;</div>
      <div>
        <div class="topbar-bank">Indian Bank</div>
        <h1>Credit Appraisal Platform</h1>
      </div>
    </div>
    <div class="topbar-actions">
      <!-- Find a borrower (press / anywhere) -->
      <div class="global-search" data-tour="search" @click.outside="searchOpen=false">
        <svg class="icon" width="16" height="16" aria-hidden="true"><use href="#i-search"/></svg>
        <input type="search" x-ref="globalSearch" x-model="searchQuery" placeholder="Find a borrower   ( / )"
               aria-label="Find a borrower by name, ID, CIN or PAN" autocomplete="off"
               role="combobox" :aria-expanded="searchOpen && !!searchQuery.trim()" aria-controls="global-search-results"
               @focus="searchOpen=true" @input="searchOpen=true; searchIndex=0"
               @keydown.down.prevent="moveSearch(1)" @keydown.up.prevent="moveSearch(-1)"
               @keydown.enter.prevent="openSearchResult(searchResults()[searchIndex])"
               @keydown.escape="searchOpen=false; $event.target.blur()">
        <ul id="global-search-results" class="search-results" role="listbox" x-show="searchOpen && searchQuery.trim()" x-cloak>
          <template x-for="(c, i) in searchResults()" :key="c.entity_id">
            <li role="option" :aria-selected="i === searchIndex">
              <button type="button" :class="{'is-active': i === searchIndex}" @click="openSearchResult(c)" @mouseenter="searchIndex = i">
                <span class="search-name" x-text="displayCompanyName(c.company_name)"></span>
                <span class="search-meta" x-text="c.entity_id + ' · ' + titleCase(c.sector)"></span>
                <span class="badge" :class="caseMap[c.entity_id] ? gradeCls(caseMap[c.entity_id].risk_grade) : 'badge-grey'"
                      x-text="caseMap[c.entity_id] ? 'Grade ' + (caseMap[c.entity_id].risk_grade || '--') : 'Not run'"></span>
              </button>
            </li>
          </template>
          <li class="search-empty" x-show="!searchResults().length">No borrower matches &ldquo;<span x-text="searchQuery"></span>&rdquo;</li>
        </ul>
      </div>

      <!-- Notifications: finished and failed runs -->
      <div class="topbar-menu" @click.outside="notificationsOpen=false">
        <button class="icon-btn" @click="toggleNotifications()" :aria-expanded="notificationsOpen"
                :aria-label="unreadCount() ? unreadCount() + ' unread notifications' : 'Notifications'">
          <svg class="icon" width="16" height="16" aria-hidden="true"><use href="#i-bell"/></svg>
          <span class="icon-btn-count" x-show="unreadCount()" x-text="unreadCount()"></span>
        </button>
        <div class="menu-panel" x-show="notificationsOpen" x-transition x-cloak>
          <div class="menu-panel-head">
            <strong>Notifications</strong>
            <span>
              <button class="link-btn" @click="markAllRead()" x-show="unreadCount()">Mark all read</button>
              <button class="link-btn" @click="clearNotifications()" x-show="notifications.length">Clear</button>
            </span>
          </div>
          <template x-for="n in notifications" :key="n.id">
            <button type="button" class="menu-item" :class="{'is-unread': !n.read}" @click="openNotification(n)">
              <span class="menu-dot" :class="n.tone === 'error' ? 'bar-red' : 'bar-green'"></span>
              <span class="menu-item-text">
                <span x-text="n.text"></span>
                <span class="menu-item-time" x-text="formatRunTime(n.at)"></span>
              </span>
            </button>
          </template>
          <p class="menu-empty" x-show="!notifications.length">No notifications yet. Finished and failed CAM runs appear here.</p>
        </div>
      </div>

      <button class="icon-btn" @click="startTour()" aria-label="Take the guided tour" title="Guided tour">
        <svg class="icon" width="16" height="16" aria-hidden="true"><use href="#i-help"/></svg>
      </button>
      <button class="btn btn-gold create-cam-btn" data-tour="new" :class="{'is-active': page==='onboard'}" @click="startCamJourney()">
        <svg class="icon" width="16" height="16" aria-hidden="true"><use href="#i-plus"/></svg> Create New CAM
      </button>
      <div class="profile-badge" aria-hidden="true">CO</div>
    </div>
    <div class="loading-bar" x-show="loading" x-cloak role="progressbar" aria-label="Loading"></div>
  </header>

  <nav class="app-subnav" aria-label="Main">
    <button class="subnav-btn" data-tour="summary" :class="{'is-active': page==='summary'}" :aria-current="page==='summary' && 'page'" @click="navigate('summary')">Summary</button>
    <button class="subnav-btn" data-tour="cases" :class="{'is-active': page==='cases' || page==='detail'}" :aria-current="(page==='cases' || page==='detail') && 'page'" @click="navigate('cases')">Cases</button>
    <button class="subnav-btn" data-tour="run" :class="{'is-active': page==='pipeline'}" :aria-current="page==='pipeline' && 'page'" @click="navigate('pipeline')">Run CAM</button>
    <button class="subnav-btn" data-tour="approvals" :class="{'is-active': page==='approvals'}" :aria-current="page==='approvals' && 'page'" @click="navigate('approvals')">
      Approvals <span class="tab-count" x-show="overdueCount()" x-text="overdueCount() + ' overdue'"></span>
    </button>
    <button class="subnav-btn" :class="{'is-active': page==='settings'}" :aria-current="page==='settings' && 'page'" @click="navigate('settings')">Settings</button>
  </nav>

  <!-- Guided tour -->
  <div class="tour-layer" x-show="tourStep >= 0" x-cloak @keydown.escape.window="endTour()">
    <div class="tour-card" role="dialog" aria-modal="true" :aria-label="currentTourStep()?.title">
      <span class="tour-step" x-text="'Step ' + (tourStep + 1) + ' of ' + tourSteps().length"></span>
      <h3 x-text="currentTourStep()?.title"></h3>
      <p x-text="currentTourStep()?.text"></p>
      <div class="tour-actions">
        <button class="btn btn-ghost btn-sm" @click="endTour()">Skip tour</button>
        <button class="btn btn-primary btn-sm" @click="nextTourStep()" x-text="tourStep >= tourSteps().length - 1 ? 'Finish' : 'Next'"></button>
      </div>
    </div>
  </div>

  <main id="main" class="main-content" tabindex="-1">

    <!-- Notification toast -->
    <div class="toast" x-show="toast" x-transition x-text="toast"
         @click="toast=''" :class="toastType"></div>

    <!-- One file per page (templates/pages/), inlined by src/core/ui_paths.render_spa() -->
    <!-- include: pages/summary.html -->
    <!-- include: pages/cases.html -->
    <!-- include: pages/workspace.html -->
    <!-- include: pages/journey.html -->
    <!-- include: pages/run-cam.html -->
    <!-- include: pages/approvals.html -->
    <!-- include: pages/settings.html -->

  </main>
</div>

<!-- Page modules first: camApp() in app.js merges them into one Alpine component. -->

<script src="/static/js/modules/shell.js"></script>
<script src="/static/js/modules/summary.js"></script>
<script src="/static/js/modules/journey.js"></script>
<script src="/static/js/modules/pipeline.js"></script>
<script src="/static/js/modules/case-detail.js"></script>
<script src="/static/js/modules/documents.js"></script>
<script src="/static/js/modules/reports.js"></script>
<script src="/static/js/modules/approvals.js"></script>
<script src="/static/js/modules/observations.js"></script>
<script src="/static/js/modules/investigations.js"></script>
<script src="/static/js/modules/challenges.js"></script>
<script src="/static/js/modules/repayment.js"></script>
<script src="/static/js/modules/stress.js"></script>
<script src="/static/js/modules/reassessment.js"></script>
<script src="/static/js/modules/finalcam.js"></script>
<script src="/static/js/modules/overview.js"></script>
<script src="/static/js/modules/settings.js"></script>
<script src="/static/js/app.js"></script>
</body>
</html>
